name: Build Dual Player APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip DualPlayerSource.zip -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix JVM target
        run: |
          cd project
          find . -name "*.gradle" -type f -print0 | xargs -0 sed -i \
            -e 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' \
            -e 's/jvmTarget *= *["'\'']1\.8["'\'']/jvmTarget = '\''17'\''/g'

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DualPlayer-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
